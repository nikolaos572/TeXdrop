<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeXdrop</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script src="/static/common.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a href="/" class="pill brand">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
        <path d="M14 3v5h5M9 13h6M9 17h4"/>
      </svg>
      TeXdrop
    </a>
    <nav>
      <a href="/info" class="pill">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
        Server Info
      </a>
    </nav>
    <div class="theme-switch" role="group" aria-label="Colour theme">
      <button type="button" data-theme-choice="light" title="Light theme" aria-label="Light theme">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
      <button type="button" data-theme-choice="dark" title="Dark theme" aria-label="Dark theme">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button type="button" data-theme-choice="auto" title="Auto: the browser's theme" aria-label="Auto theme (the browser's)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </button>
    </div>
    <span class="spacer"></span>
    <span id="user" class="muted"></span>
    <button id="logout" type="button" class="pill danger">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M6 4l7 2v13l-7 2M11 12h.01"/></svg>
      Log out
    </button>
  </header>

  <main>
    <section id="compile" class="card">
      <label id="dropzone" class="dropzone" tabindex="0">
        <input id="file" type="file" accept=".zip,.7z,.tar,.tgz,.gz,.tbz2,.bz2,.txz,.xz" hidden>
        <strong id="drop-title">Drop your LaTeX project here</strong>
        <span id="drop-hint" class="muted">or click to choose a .zip, .7z, .tar, .tar.gz, .tar.bz2 or .tar.xz file</span>
      </label>
      <div class="fields">
        <div class="field main-file">
          <label for="main">Main .tex file</label>
          <input id="main" type="text" list="tex-files" autocomplete="off" spellcheck="false" disabled>
          <datalist id="tex-files"></datalist>
        </div>
        <div class="field">
          <label for="engine">Engine</label>
          <select id="engine">
            <option value="pdflatex">pdfLaTeX</option>
            <option value="xelatex">XeLaTeX</option>
            <option value="lualatex">LuaLaTeX</option>
          </select>
        </div>
        <button id="compile-button" type="button" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
          Compile
        </button>
      </div>
      <p id="message" class="message" role="status"></p>
    </section>

    <section id="jobs" class="card">
      <div class="section-head">
        <h2>Jobs</h2>
        <span class="spacer"></span>
        <button id="refresh" type="button" class="secondary">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          Refresh
        </button>
        <button id="delete-all" type="button" class="danger" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>
          Delete all jobs
        </button>
      </div>
      <p id="no-jobs" class="muted">No jobs yet.</p>
      <div class="table-wrap">
        <table id="jobs-table" hidden>
          <thead>
            <tr>
              <th>#</th><th>File</th><th>Main file</th><th>Engine</th><th>Status</th>
              <th>Submitted</th><th>Finished</th><th>Downloads</th><th></th>
            </tr>
          </thead>
          <tbody id="jobs-body"></tbody>
        </table>
      </div>
      <div id="pager" class="pager" hidden>
        <button id="previous-page" type="button" class="secondary small">‹ Previous</button>
        <span id="page-info" class="muted"></span>
        <button id="next-page" type="button" class="secondary small">Next ›</button>
      </div>
    </section>
  </main>
  <pre id="error-tooltip" class="error-tooltip" role="tooltip" hidden></pre>
</body>
</html>
