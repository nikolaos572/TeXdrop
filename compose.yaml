# Example deployment: docker compose up -d
# Before the first start: mkdir data && sudo chown -R 61001:61001 data.
# After it, add users: docker compose exec texdrop python -m texdrop adduser <name>, which prints their token.
# Every setting is described in docs/CONFIGURATION.md, the container's resource limits in docs/DEPLOYMENT.md.
services:
  texdrop:
    image: texdrop:latest
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      TZ: UTC                    # time zone used to display dates, e.g. Europe/Athens
      PUBLIC_BASE_URL: ""        # recommended, e.g. https://texdrop.example.com: the address users reach (docs/CONFIGURATION.md)
      AUTO_DELETE_DAYS: "0"      # delete jobs finished more than N days ago (0 = never)
      COMPILE_TIMEOUT_MINUTES: "15"
      MAX_UPLOAD_MB: "100"
      ENABLE_MCP: "0"            # 1 serves the MCP server for AI agents at /mcp (docs/MCP.md)
      FORWARDED_ALLOW_IPS: ""    # empty: any peer may be the proxy; or name yours, e.g. 172.17.0.1 (docs/DEPLOYMENT.md)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
