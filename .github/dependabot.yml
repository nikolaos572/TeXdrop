# Weekly update PRs, one per ecosystem. The Docker base image (texlive/texlive:latest)
# is not listed: it has no version to bump, and rebuilding the image picks up the newest.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
